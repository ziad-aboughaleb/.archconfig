# vim:set ft=sh
# =========================================================================
# /etc/mkinitcpio.conf - Early boot environment configuration
# =========================================================================

# MODULES
# Loading btrfs early ensures the filesystem is recognized instantly.
MODULES=(btrfs)

# BINARIES
# Include standard binaries. Btrfs tools are useful for recovery drops.
BINARIES=(btrfs)

# FILES
# Any additional files you need in the early boot environment.
FILES=()

# HOOKS
# Order matters.
# - 'udev' sets up the device nodes (/dev/tty*).
# - 'tty-colors' immediately themes the consoles the millisecond they exist.
# - 'kms' ensures your native screen resolution loads instantly instead of switching mid-boot.
# - 'autodetect' shrinks the image by only including modules your hardware actually uses.
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block filesystems fsck)

# COMPRESSION
# Zstandard (zstd) offers the best balance of decompression speed and ratio.
COMPRESSION="zstd"

# COMPRESSION_OPTIONS
# -T0 tells zstd to use all available CPU threads during image generation, making mkinitcpio much faster.
COMPRESSION_OPTIONS=("-T0")
