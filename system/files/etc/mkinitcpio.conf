# vim:set ft=sh
# =========================================================================
# /etc/mkinitcpio.conf - Early boot environment configuration
# =========================================================================

# MODULES
# Loading btrfs early ensures the filesystem is recognized instantly.
MODULES=(btrfs)

# BINARIES
# Include standard binaries. Btrfs tools are useful for recovery drops.
BINARIES=(btrfs)

# FILES
# Any additional files you need in the early boot environment.
FILES=()

# HOOKS
# Order matters.
# - 'systemd' sets up the early init and device nodes.
# - 'kms' ensures your native screen resolution loads instantly.
# - 'sd-vconsole' pulls in /etc/vconsole.conf to theme the tty immediately.
# - 'autodetect' shrinks the image by only including used modules.
# Note: 'fsck' is intentionally omitted because Btrfs handles checks on mount.
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole tty-colors block filesystems)

# COMPRESSION
# Zstandard (zstd) offers the best balance of decompression speed and ratio.
COMPRESSION="zstd"

# COMPRESSION_OPTIONS
# -T0 tells zstd to use all available CPU threads during image generation.
COMPRESSION_OPTIONS=("-T0")
