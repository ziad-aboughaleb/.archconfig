# /etc/pacman.conf
#
# ==========================================
# 1. GENERAL OPTIONS
# ==========================================
[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

# ==========================================
# 2. APPEARANCE
# ==========================================
Color
ILoveCandy

# ==========================================
# 3. SECURITY & SIGNATURES
# ==========================================
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# ==========================================
# 4. CACHYOS v3 REPOSITORIES (MODERN CPU ONLY)
# ==========================================
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

# ==========================================
# 5. CACHYOS STANDARD REPOSITORIES
# ==========================================
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# ==========================================
# 6. ARCH LINUX CORE REPOSITORIES
# ==========================================
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
