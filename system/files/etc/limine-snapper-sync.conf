# /etc/limine-snapper-sync.conf
#
# ==========================================
# 1. SNAPPER TARGETS
# ==========================================
# The snapper configuration name(s) to track.
SNAPPER_CONFIGS=("root")

# ==========================================
# 2. ESP SPACE MANAGEMENT (CRITICAL)
# ==========================================
# Limits how many snapshots appear in your boot menu. 5 is usually
# plenty for recovery. The default is "auto", which fills the menu.
MAX_SNAPSHOT_ENTRIES=5

# Stops creating new snapshot boot entries if your boot partition
# exceeds this capacity. It will silently prune older snapshots to
# make room, guaranteeing you always have space for standard kernel updates.
LIMIT_USAGE_PERCENT=75

# ==========================================
# 3. KERNEL PARAMETERS
# ==========================================
# By default, limine-snapper-sync pulls parameters from /etc/kernel/cmdline
# or your live system. Uncomment and set this ONLY if you need to force
# specific kernel flags for snapshots.
# KERNEL_CMDLINE[default]=""

# ==========================================
# 4. PATH OVERRIDES
# ==========================================
# Automatically detected by default. Uncomment and set this ONLY
# if the tool fails to automatically find your EFI/Boot partition.
# ESP_PATH="/boot"
