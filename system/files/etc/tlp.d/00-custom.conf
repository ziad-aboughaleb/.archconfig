# ------------------------------------------------------------------------------
# TLP Custom Configuration for Performance & Battery Balance
# Path: /etc/tlp.d/00-custom.conf
# ------------------------------------------------------------------------------

# Enable TLP (1 = enabled, 0 = disabled)
TLP_ENABLE=1

# Operation mode based on power source
TLP_DEFAULT_MODE=AC

# --- CPU Power Settings ---
# Select CPU scaling governors (schedutil is recommended for modern kernels)
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Energy Performance Preference (EPP) for Intel/AMD CPUs
# 'performance' gives max speed, 'power' forces deep energy savings
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Allow turbo boost on AC, optionally disable or let it ride on battery
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1

# --- Platform & System Profiles ---
# Maps to kernel/platform profiles if supported by your hardware
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# --- Disk & Storage ---
# Minimizes disk writes and spins down idle drives on battery
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=60

# --- PCI(e) & Bus Power Management ---
# Powers down internal PCIe devices when idle to save battery
PCIE_ASPM_ON_AC=performance
PCIE_ASPM_ON_BAT=powersave

# --- USB Power Management ---
# Automatically suspends idle USB devices to prevent hidden battery drain
USB_AUTOSUSPEND=1
USB_EXCLUDE_BTUSB=0

# --- Wi-Fi & Radios ---
# Ensure Wi-Fi power saving is active on battery
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Keep Wi-Fi enabled on startup (prevents TLP from killing your network card on boot)
DEVICES_TO_ENABLE_ON_STARTUP="wifi"
