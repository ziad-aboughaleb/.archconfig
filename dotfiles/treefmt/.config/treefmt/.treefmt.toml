[global]
on_unmatched = "ignore"
indent_type = "spaces"
indent_size = 2
excludes = [
  "*.patch",
  "*.lock",
  ".env*",
  "result/*",
  "**/node_modules/**",
  "**/oh-my-zsh/**",
  ".github/*",
  ".local/*",
  ".cache/*",
  ".rustup/*",
  ".cargo/*",
]

[formatter.shfmt]
command = "shfmt"
options = ["-i", "2", "-w"]
includes = ["*.sh"]

[formatter.stylua]
command = "stylua"
includes = ["*.lua"]

[formatter.taplo]
command = "taplo"
options = ["fmt"]
includes = ["*.toml"]

[formatter.texfmt]
command = "tex-fmt"
includes = ["*.tex", "*.sty", "*.cls"]

[formatter.clang-format]
command = "clang-format"
options = [
  "-i",
  "-style={BasedOnStyle: Google, IndentWidth: 2, ColumnLimit: 80, BreakBeforeBraces: Attach}",
]
includes = ["*.c", "*.cpp", "*.cc", "*.cxx", "*.h", "*.hpp", "*.hxx"]

[formatter.prettier]
command = "/home/ziad/.config/treefmt/prettier/my-prettier-tool"
includes = [
  "*.js",
  "*.jsx",
  "*.ts",
  "*.tsx",
  "*.css",
  "*.scss",
  "*.html",
  "*.json",
  "*.yaml",
  "*.yml",
  "*.md",
]
